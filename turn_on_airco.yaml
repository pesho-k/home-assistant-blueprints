blueprint:
  name: Turn ON Airco (Season-Aware)
  description: >
    Turns on an airco for heating (winter) when cold enough or cooling (summer) when warm enough, with sufficient solar power.
    The season comes from a Season Helper, so all aircos switch between heating and cooling at once.
  domain: automation
  input:
    climate_entity:
      name: Climate Entity
      description: The climate entity to turn on
      selector:
        entity:
          domain: climate
    temperature_sensor:
      name: Temperature Sensor
      description: The temperature sensor for this room
      selector:
        entity:
          domain: sensor
    season_entity:
      name: Season Helper
      description: >
        An input_select with the options "heating" and "cooling". Switching it changes the season
        for all aircos that use it.
      selector:
        entity:
          domain: input_select
    heating_trigger_temp:
      name: Heating - Turn On Below
      description: In the heating season the airco turns on when the room is colder than this
      default: 20
      selector:
        number:
          min: 10
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    cooling_trigger_temp:
      name: Cooling - Turn On Above
      description: In the cooling season the airco turns on when the room is warmer than this
      default: 21
      selector:
        number:
          min: 18
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    required_power_surplus_sensor:
      name: Required Power Surplus Sensor
      description: Sensor with required power surplus for airco
      selector:
        entity:
          domain: sensor
    power_approximation_sensor:
      name: Power Approximation Sensor
      description: Power approximation sensor
      selector:
        entity:
          domain: sensor
    priority_temp_sensor:
      name: Priority Temperature Sensor
      description: For cooling mode - highest temp among inactive aircos. For heating mode - lowest temp among inactive aircos
      selector:
        entity:
          domain: sensor
    disable_switch:
      name: Disable Airco Input Boolean
      description: input_boolean to disable this automation
      selector:
        entity:
          domain: input_boolean
    airco_turning_on_boolean:
      name: Airco Turning On Input Boolean
      description: input_boolean to avoid multiple triggers (race conditions)
      selector:
        entity:
          domain: input_boolean
    related_airco_automations:
      name: Related Airco Automations
      description: List of related automation entity_ids
      default: []
      selector:
        entity:
          domain: automation
          multiple: true
    active_aircos_sensor:
      name: Active Aircos Sensor
      description: Sensor that counts the number of active aircos
      selector:
        entity:
          domain: sensor
    notify_entity:
      name: Notification Entity
      description: Notify entity used to send the status email (e.g. the SMTP notify entity)
      selector:
        entity:
          domain: notify

variables:
  temperature_sensor: !input temperature_sensor
  priority_temp_sensor: !input priority_temp_sensor
  climate_entity: !input climate_entity
  active_aircos_sensor: !input active_aircos_sensor
  power_approximation_sensor: !input power_approximation_sensor
  required_power_surplus_sensor: !input required_power_surplus_sensor
  season_entity: !input season_entity
  season: "{{ states(season_entity) | lower }}"
  airco_turning_on_boolean: !input airco_turning_on_boolean

trigger:
  - platform: numeric_state
    entity_id: !input temperature_sensor
    above: !input cooling_trigger_temp
    id: temp_above
  - platform: numeric_state
    entity_id: !input temperature_sensor
    below: !input heating_trigger_temp
    id: temp_below
  - platform: numeric_state
    entity_id: !input power_approximation_sensor
    below: !input required_power_surplus_sensor
    id: power_surplus
  # Thresholds only fire when crossed, so re-check when the airco is enabled again (e.g. after sleep)
  - platform: state
    entity_id: !input disable_switch
    to: "off"
    id: re_enabled

condition:
  - condition: state
    entity_id: !input disable_switch
    state: "off"
  - alias: The room needs heating or cooling
    condition: or
    conditions:
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ season == 'cooling' }}"
          - condition: numeric_state
            entity_id: !input temperature_sensor
            above: !input cooling_trigger_temp
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ season == 'heating' }}"
          - condition: numeric_state
            entity_id: !input temperature_sensor
            below: !input heating_trigger_temp
  - condition: numeric_state
    entity_id: !input power_approximation_sensor
    below: !input required_power_surplus_sensor
  - condition: state
    entity_id: !input climate_entity
    state: "off"
  - condition: template
    value_template: >
      {% if season == 'cooling' %}
        {{ (states(temperature_sensor)|float(0)) >= (states(priority_temp_sensor)|float(100)) }}
      {% else %}
        {{ (states(temperature_sensor)|float(100)) <= (states(priority_temp_sensor)|float(0)) }}
      {% endif %}
  - alias: No other airco is being turned on (a lock older than 3 minutes is stale, e.g. after a restart)
    condition: template
    value_template: >
      {{ is_state(airco_turning_on_boolean, 'off')
         or (now() - states[airco_turning_on_boolean].last_changed).total_seconds() > 180 }}

action:
  - service: input_boolean.turn_on
    target:
      entity_id: !input airco_turning_on_boolean
  - delay: "00:00:05"
  # set_hvac_mode also turns the airco on; a separate climate.turn_on would send an extra IR command
  - service: climate.set_hvac_mode
    target:
      entity_id: !input climate_entity
    data:
      hvac_mode: >
        {% if season == 'heating' %}
          heat
        {% else %}
          cool
        {% endif %}
  - action: notify.send_message
    target:
      entity_id: !input notify_entity
    data:
      title: >
        {{ climate_entity }} turned ON ({{ season }} mode)
      message: |
        {{ climate_entity }} turned ON in {{ season }} mode.
        Current temperature: {{ states(temperature_sensor) }}°C
        Total active aircos: {{ (states(active_aircos_sensor)|int) + 1 }}
        Power Approximation: {{ states(power_approximation_sensor) }}W
        Required: {{ states(required_power_surplus_sensor) }}W
  - delay: "00:02:30"
  - service: input_boolean.turn_off
    target:
      entity_id: !input airco_turning_on_boolean
  - repeat:
      for_each: !input related_airco_automations
      sequence:
        - service: automation.trigger
          target:
            entity_id: "{{ repeat.item }}"
          data:
            skip_condition: false

mode: single
