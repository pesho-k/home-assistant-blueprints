blueprint:
  name: Turn OFF Airco (Season-Aware)
  description: >
    Turns off an airco when conditions are met: for cooling mode when temperature drops or insufficient power; for heating mode when temperature rises or insufficient power.
    Use a Season Helper to switch all aircos between heating and cooling at once.
  domain: automation
  input:
    temperature_sensor:
      name: Temperature Sensor
      description: The sensor that measures the temperature in the target room
      selector:
        entity:
          domain: sensor
    power_approximation_sensor:
      name: Power Approximation Sensor
      description: >
        The sensor that approximates the available solar power (negative values mean power surplus).
        This is used to trigger turning off the airco when the generated solar power is insufficient.
      selector:
        entity:
          domain: sensor
    climate_entity:
      name: Climate Entity
      description: The climate entity for the airco to turn off
      selector:
        entity:
          domain: climate
    season_entity:
      name: Season Helper (optional)
      description: >
        An input_select with the options "heating" and "cooling" that switches all aircos
        between seasons at once. When set, it overrides Season Mode.
      default: ""
      selector:
        entity:
          domain: input_select
    season_mode:
      name: Season Mode
      description: Heating (winter) or cooling (summer); only used when no Season Helper is set
      default: cooling
      selector:
        select:
          options:
            - label: "Heating (Winter)"
              value: "heating"
            - label: "Cooling (Summer)"
              value: "cooling"
    heating_off_temp:
      name: Heating - Turn Off Above
      description: In the heating season the airco turns off when the room is warmer than this
      default: 21
      selector:
        number:
          min: 10
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    cooling_off_temp:
      name: Cooling - Turn Off Below
      description: In the cooling season the airco turns off when the room is colder than this
      default: 19
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    priority_active_temp_sensor:
      name: Priority Active Temperature Sensor
      description: For cooling mode - lowest temp among active aircos. For heating mode - highest temp among active aircos
      selector:
        entity:
          domain: sensor
    airco_turning_off_boolean:
      name: Airco Turning Off Boolean
      description: The input_boolean helper that shows if any airco is currently being turned off (to avoid multiple triggers).
      selector:
        entity:
          domain: input_boolean
    disable_airco_xyz_boolean:
      name: Disable Airco XYZ Boolean
      description: >
        An input_boolean that, when ON, disables this automation.
        This is useful for manual control or maintenance.
      selector:
        entity:
          domain: input_boolean
    related_airco_automations:
      name: Related Airco Automations
      description: List of related automation entity_ids
      default: []
      selector:
        entity:
          domain: automation
          multiple: true
    power_threshold:
      name: Power Threshold
      description: The power approximation value above which the airco should turn off (e.g., 0 for no surplus)
      default: 0
      selector:
        number:
          min: -50
          max: 1000
          step: 10
    notify_entity:
      name: Notification Entity
      description: Notify entity used to send the status email (e.g. the SMTP notify entity)
      selector:
        entity:
          domain: notify

variables:
  climate_entity: !input climate_entity
  temperature_sensor: !input temperature_sensor
  priority_active_temp_sensor: !input priority_active_temp_sensor
  power_approximation_sensor: !input power_approximation_sensor
  season_entity: !input season_entity
  season_mode: !input season_mode
  season: "{{ (states(season_entity) if season_entity else season_mode) | lower }}"
  heating_off_temp: !input heating_off_temp
  cooling_off_temp: !input cooling_off_temp
  power_threshold: !input power_threshold
  airco_turning_off_boolean: !input airco_turning_off_boolean

triggers:
  - entity_id: !input temperature_sensor
    below: !input cooling_off_temp
    trigger: numeric_state
    id: temp_below_trigger
  - entity_id: !input temperature_sensor
    above: !input heating_off_temp
    trigger: numeric_state
    id: temp_above_trigger
  - entity_id: !input power_approximation_sensor
    above: !input power_threshold
    trigger: numeric_state
    id: power_insufficient_trigger
conditions:
  - alias: The airco is not disabled
    condition: state
    entity_id: !input disable_airco_xyz_boolean
    state: "off"
  - alias: The airco is currently ON
    condition: template
    value_template: "{{ states(climate_entity) != 'off' }}"
  - alias: Season-aware temperature and power conditions
    condition: or
    conditions:
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ season == 'cooling' }}"
          - condition: template
            value_template: "{{ (states(temperature_sensor)|float(0)) < cooling_off_temp }}"
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ season == 'heating' }}"
          - condition: template
            value_template: "{{ (states(temperature_sensor)|float(0)) > heating_off_temp }}"
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ (states(power_approximation_sensor)|float(0)) > (power_threshold|float(0)) }}"
          - condition: template
            value_template: >-
              {% if season == 'cooling' %}
                {{ (states(temperature_sensor)|float(0)) <= (states(priority_active_temp_sensor)|float(100)) }}
              {% else %}
                {{ (states(temperature_sensor)|float(100)) >= (states(priority_active_temp_sensor)|float(0)) }}
              {% endif %}
          - alias: No other airco is being turned off (a lock older than 3 minutes is stale, e.g. after a restart)
            condition: template
            value_template: >
              {{ is_state(airco_turning_off_boolean, 'off')
                 or (now() - states[airco_turning_off_boolean].last_changed).total_seconds() > 180 }}
actions:
  - target:
      entity_id: !input airco_turning_off_boolean
    action: input_boolean.turn_on
    data: {}
  - delay: "00:00:05"
  - target:
      entity_id: !input climate_entity
    action: climate.turn_off
    data: {}
  - action: notify.send_message
    target:
      entity_id: !input notify_entity
    data:
      title: >
        {{ climate_entity }} turned OFF ({{ season }} mode)
      message: |
        {{ climate_entity }} turned OFF from {{ season }} mode.
        Current temperature: {{ states(temperature_sensor) }}°C
        Total active aircos: {{ (states('sensor.active_aircos')|int) - 1 }}
        Power Approximation: {{ states(power_approximation_sensor) }}W
  - delay: "00:02:30"
  - target:
      entity_id: !input airco_turning_off_boolean
    action: input_boolean.turn_off
    data: {}
  - repeat:
      for_each: !input related_airco_automations
      sequence:
        - service: automation.trigger
          target:
            entity_id: "{{ repeat.item }}"
          data:
            skip_condition: false
mode: single

