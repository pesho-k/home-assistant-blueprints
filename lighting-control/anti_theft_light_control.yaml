blueprint:
  name: Anti-theft Light Control
  description: >
    Turns on a switch (like a HomeWizard Energy Socket) at a random moment in the 20 minutes from 15 minutes before sunset,
    and off at a random moment in the 35 minutes after the off time.
    After a Home Assistant restart the switch is put back in its scheduled state.
  domain: automation
  input:
    switch_target:
      name: Switch
      description: The switch to control
      selector:
        entity:
          domain: switch

    off_time:
      name: Off time
      description: The earliest time to turn the switch off (it turns off up to 35 minutes later)
      default: "23:00:00"
      selector:
        time:

# The off moment has its own trigger instead of a delay of several hours,
# so a restart in the evening cannot leave the switch on all night.
trigger:
  - platform: sun
    event: sunset
    offset: "-00:15:00"
    id: lights_on
  - platform: time
    at: !input off_time
    id: lights_off
  - platform: homeassistant
    event: start
    id: ha_start

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: lights_on
        sequence:
          - delay:
              seconds: "{{ range(0, 20*60) | random }}"
          - service: switch.turn_on
            target:
              entity_id: !input switch_target
      - conditions:
          - condition: trigger
            id: lights_off
        sequence:
          - delay:
              seconds: "{{ range(0, 35*60) | random }}"
          - service: switch.turn_off
            target:
              entity_id: !input switch_target
      - conditions:
          - condition: trigger
            id: ha_start
        sequence:
          - if:
              - condition: sun
                after: sunset
                after_offset: "-00:15:00"
              - condition: time
                before: !input off_time
            then:
              - service: switch.turn_on
                target:
                  entity_id: !input switch_target
            else:
              - service: switch.turn_off
                target:
                  entity_id: !input switch_target

# restart: if the off time is close to sunset, "lights_off" cancels a pending "lights_on"
mode: restart